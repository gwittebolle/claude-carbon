# Dogfoods the root action.yml on every PR against the committed fixture
# (this repo does not run claude-code-action itself). comment: false on
# purpose: fixture numbers on real PRs would misrepresent a methodology
# project — the sticky-comment path is verified manually on a test PR.
# The assertion step is deliberate: the action itself never fails, so
# without it a regression would no-op silently forever.
name: carbon-report-dogfood

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dogfood:
    name: run the action on the fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - id: carbon
        uses: ./
        with:
          execution_file: tests/fixtures/execution-output.json
          comment: "false"

      - name: Assert the action produced real outputs
        env:
          STATUS: ${{ steps.carbon.outputs.status }}
          CO2: ${{ steps.carbon.outputs.co2_grams }}
          COST: ${{ steps.carbon.outputs.cost_usd }}
          TOKENS: ${{ steps.carbon.outputs.total_tokens }}
        run: |
          echo "status=${STATUS} co2=${CO2} cost=${COST} tokens=${TOKENS}"
          [ "$STATUS" = "ok" ] || { echo "expected status=ok"; exit 1; }
          [ -n "$CO2" ] && [ "$CO2" != "0" ] || { echo "expected non-zero co2_grams"; exit 1; }
          [ -n "$COST" ] || { echo "expected cost_usd"; exit 1; }
          [ "$TOKENS" = "150000" ] || { echo "expected total_tokens=150000, got '$TOKENS'"; exit 1; }
