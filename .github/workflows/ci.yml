name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  methodology-vectors:
    name: methodology golden vectors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # jq is preinstalled on ubuntu-latest; the runner only needs bash + jq + awk.
      - name: Replay golden vectors against data/factors.json + data/prices.json
        run: bash tests/run-vectors.sh

  install-wiring:
    name: install and update wiring
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Runs entirely under throwaway CLAUDE_CONFIG_DIRs; the update case clones this checkout
      # from disk, so no network is involved.
      - name: Exercise the settings.json merge and the update repair path
        run: bash tests/run-install-tests.sh

  badge:
    name: badge output
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Runs against throwaway fixture DBs via CLAUDE_CARBON_DB; sqlite3 and bc
      # are preinstalled on ubuntu-latest.
      - name: Assert badge URL and snippet against fixture databases
        run: bash tests/run-badge-tests.sh

  action-report:
    name: github action compute path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Replays the golden vectors through compute-lib.sh, runs the entrypoint on
      # the committed fixture, and asserts the never-fail contract on malformed inputs.
      - name: Assert the action's compute path and never-fail contract
        run: bash tests/run-action-tests.sh

  pr-report:
    name: carbon-pr pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Fixture transcript through the Stop hook (git_branch capture), then the
      # dry-run report against fixture DBs. No network, no gh.
      - name: Assert branch capture and the dev PR report
        run: bash tests/run-pr-tests.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ensure shellcheck is available
        run: command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck

      # Warnings and errors gate the build; style notes are advisory and stay out of the way.
      - name: Lint every shell script
        run: find . -name '*.sh' -not -path './.git/*' -print0 | sort -z | xargs -0 shellcheck --severity=warning

  version-manifests:
    name: version manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history + tags: the unreleased-changes check diffs against the last tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fails on a manifest mismatch (the update notice would lie); warns, without failing,
      # when runtime files have piled up since the last tag with no version bump.
      - name: Check the three version manifests agree
        run: bash scripts/check-versions.sh
